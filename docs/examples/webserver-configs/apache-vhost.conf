# MATA Dashboard - Apache Virtual Host Configuration
#
# For production deployments, place this in:
# /etc/apache2/sites-available/mata.conf
#
# Then enable with:
# sudo a2ensite mata
# sudo a2enmod rewrite headers
# sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName mata.yourdomain.com
    ServerAdmin webmaster@yourdomain.com
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        # URL Rewriting for Bramus Router
        # Routes all requests to index.php unless they match an actual file or directory
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]

        # Security headers
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options DENY
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
    </Directory>

    # Deny access to sensitive directories
    <Directory /var/www/html/config>
        Require all denied
    </Directory>

    <Directory /var/www/html/src>
        Require all denied
    </Directory>

    <Directory /var/www/html/vendor>
        Require all denied
    </Directory>

    <Directory /var/www/html/temp>
        Require all denied
    </Directory>

    <Directory /var/www/html/logs>
        Require all denied
    </Directory>

    # Block access to sensitive files
    <FilesMatch "\.(env|json|lock|md|yml|yaml|xml|ini|log|bak|backup|sql)$">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/mata-error.log
    CustomLog ${APACHE_LOG_DIR}/mata-access.log combined
</VirtualHost>


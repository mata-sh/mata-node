# MATA Dashboard - Nginx Server Block Configuration
#
# For production deployments, place this in:
# /etc/nginx/sites-available/mata
#
# Then enable with:
# sudo ln -s /etc/nginx/sites-available/mata /etc/nginx/sites-enabled/
# sudo nginx -t
# sudo systemctl reload nginx

server {
    listen 80;
    server_name mata.yourdomain.com;
    root /var/www/html/public;
    index index.php index.html;

    # URL Rewriting for Bramus Router
    # Tries files first, then directories, finally routes to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM configuration
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Deny access to sensitive directories
    location ~ /(config|vendor|src|temp|cron|logs) {
        deny all;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" always;

    # Logging
    access_log /var/log/nginx/mata-access.log;
    error_log /var/log/nginx/mata-error.log;
}


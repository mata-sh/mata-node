; ===================================================================
; Development PHP Configuration
; Used in development environment (Dockerfile.dev)
; ===================================================================

; ===========================
; Error Handling & Reporting
; ===========================
display_errors = 1
display_startup_errors = 1
error_reporting = E_ALL
log_errors = 1
error_log = /var/www/html/logs/php-error.log
html_errors = 1

; ===========================
; Resource Limits
; ===========================
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
post_max_size = 64M
upload_max_filesize = 64M

; ===========================
; OPcache - Disabled for Dev
; ===========================
; Changes reflect immediately without cache
opcache.enable = 0
opcache.enable_cli = 0

; If you need OPcache enabled but want immediate changes, use:
; opcache.validate_timestamps = 1
; opcache.revalidate_freq = 0

; ===========================
; Xdebug (if installed)
; ===========================
; Uncomment these if Xdebug is enabled in Dockerfile.dev
; xdebug.mode = debug
; xdebug.start_with_request = yes
; xdebug.client_host = host.docker.internal
; xdebug.client_port = 9003
; xdebug.idekey = VSCODE
; xdebug.log = /var/www/html/logs/xdebug.log

; ===========================
; Development Settings
; ===========================
expose_php = 1
allow_url_include = 0
short_open_tag = 0
variables_order = "EGPCS"
disable_functions =

; ===========================
; Timezone
; ===========================
date.timezone = "UTC"

; ===========================
; MySQLi/PDO
; ===========================
mysqli.default_socket = /var/run/mysqld/mysqld.sock
pdo_mysql.default_socket = /var/run/mysqld/mysqld.sock

; ===========================
; Output Buffering
; ===========================
output_buffering = 4096
implicit_flush = 0

; ===========================
; Realpath Cache
; ===========================
realpath_cache_size = 4096K
realpath_cache_ttl = 120 

; MATA Node - Production-Optimized PHP Configuration
; Ultra-performance and security focused

[PHP]
; Basic Settings
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = On
zlib.output_compression_level = 6
implicit_flush = Off
unserialize_callback_func =
serialize_precision = -1
# disable_functions = exec,passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source,phpinfo,file_get_contents
disable_functions = 
disable_classes = 
zend.enable_gc = On
zend.exception_ignore_args = On

; Resource Limits (optimized for monitoring app)
max_execution_time = 120
max_input_time = 30
memory_limit = 512M

; Error handling and logging (production)
log_errors = On
log_errors_max_len = 1024
ignore_repeated_errors = On
ignore_repeated_source = On
report_memleaks = Off
display_errors = Off
display_startup_errors = Off
error_reporting = E_ERROR | E_WARNING | E_PARSE
error_log = /var/www/html/logs/php-error.log

; Data Handling
variables_order = "EGPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On
post_max_size = 32M
auto_prepend_file =
auto_append_file =
default_mimetype = "text/html"
default_charset = "UTF-8"

; File Uploads
file_uploads = On
upload_max_filesize = 32M
max_file_uploads = 10

; Fopen wrappers
allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 30
user_agent = "MATA-Node/1.0"

; Security (hardened)
expose_php = Off
allow_webdav_methods = Off
auto_detect_line_endings = Off

; OPcache (production optimized)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
opcache.fast_shutdown = 1
opcache.enable_file_override = 1
opcache.optimization_level = 0x7FFFBFFF
opcache.save_comments = 0
opcache.load_comments = 0

; JIT (PHP 8+ optimization)
opcache.jit_buffer_size = 128M
opcache.jit = function

; Date
date.timezone = "UTC"

; Realpath cache (performance boost)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; cURL
curl.cainfo = /etc/ssl/certs/ca-certificates.crt

; MySQL optimizations
mysql.allow_local_infile = Off
mysql.allow_persistent = On
mysql.cache_size = 4000
mysql.max_persistent = 10
mysql.max_links = 20
mysql.connect_timeout = 30
mysql.trace_mode = Off

; MySQLi
mysqli.max_persistent = 10
mysqli.allow_persistent = On
mysqli.max_links = 20
mysqli.cache_size = 4000
mysqli.default_port = 3306
mysqli.reconnect = Off

; PDO
pdo_mysql.cache_size = 4000

; PCRE (optimized)
pcre.backtrack_limit = 1000000
pcre.recursion_limit = 100000
pcre.jit = 1

; JSON
json.serialize_precision = -1

; Additional security
allow_url_include = Off
auto_append_file =
auto_prepend_file =
doc_root =
open_basedir = /var/www/html:/tmp:/usr/share/php:/etc/ssl/certs

; Garbage collection tuning
zend.enable_gc = On
opcache.interned_strings_buffer = 16

; Maximum input variables
max_input_vars = 3000
max_input_nesting_level = 64

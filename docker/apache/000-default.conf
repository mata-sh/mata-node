<VirtualHost *:80>
    # MATA Node - Apache Configuration
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public
    
    # Directory settings for the public folder
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        # URL Rewriting for Bramus Router
        # Rewrite all requests to index.php unless they match an actual file or directory
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]

        # Security headers
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options DENY
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
    </Directory>
    
    # Deny access to sensitive directories
    <Directory /var/www/html/config>
        Require all denied
    </Directory>
    
    <Directory /var/www/html/src>
        Require all denied
    </Directory>
    
    <Directory /var/www/html/temp>
        Require all denied
    </Directory>
    
    <Directory /var/www/html/logs>
        Require all denied
    </Directory>
    
    <Directory /var/www/html/vendor>
        Require all denied
    </Directory>
    
    <Directory /var/www/html/scripts>
        Require all denied
    </Directory>
    
    <Directory /var/www/html/cron>
        Require all denied
    </Directory>
    
    # Block access to sensitive files
    <FilesMatch "\.(env|json|lock|md|yml|yaml|xml|ini|log|bak|backup|sql)$">
        Require all denied
    </FilesMatch>
    
    <FilesMatch "^(composer|package|docker-compose|\.git|\.docker)">
        Require all denied
    </FilesMatch>
    
    # Enable compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/xml
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE text/javascript
        AddOutputFilterByType DEFLATE application/xml
        AddOutputFilterByType DEFLATE application/xhtml+xml
        AddOutputFilterByType DEFLATE application/rss+xml
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/x-javascript
        AddOutputFilterByType DEFLATE application/json
    </IfModule>
    
    # Cache static assets
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/gif "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/pdf "access plus 1 month"
        ExpiresByType text/javascript "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType application/x-javascript "access plus 1 month"
        ExpiresByType application/x-shockwave-flash "access plus 1 month"
        ExpiresByType image/x-icon "access plus 1 year"
        ExpiresDefault "access plus 2 days"
    </IfModule>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/mata_error.log
    CustomLog ${APACHE_LOG_DIR}/mata_access.log combined
    LogLevel warn
    
    # PHP settings
    php_value post_max_size 64M
    php_value upload_max_filesize 64M
    php_value max_execution_time 300
    php_value memory_limit 256M
    
</VirtualHost>

